apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-dev
  namespace: {{ .Values.namespace | default "mes-dev" }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: sample-app-dev
  template:
    metadata:
      labels:
        app: sample-app-dev
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          env:
          {{- with .Values.env }}
          {{- toYaml . | nindent 12 }}
          {{- end }}